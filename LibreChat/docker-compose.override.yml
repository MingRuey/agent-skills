services:
  api:
    ports: !override
      - "127.0.0.1:${PORT}:${PORT}"
    # Start after the memory server so LibreChat's MCP init can connect to it
    depends_on:
      - mcp-memory
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml

  # Hybrid memory: local sqlite-vec for reads, background sync to Cloudflare (D1 + Vectorize).
  # LibreChat reaches it at http://mcp-memory:8000/mcp; host-side Claude Code at 127.0.0.1:2068.
  mcp-memory:
    # Pinned: ghcr.io's copy stopped at 10.70.3, which has the open-DCR token hole
    # (GHSA-6mvm-q4j3-27qg, fixed 11.11.0). Docker Hub has current releases.
    image: docker.io/doobidoo/mcp-memory-service:12.4.0
    container_name: mcp-memory
    ports:
      - "127.0.0.1:${MCP_MEMORY_PORT:-2068}:8000"
    environment:
      - MCP_MODE=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8000
      - MCP_API_KEY=${MCP_MEMORY_API_KEY}
      - MCP_MEMORY_STORAGE_BACKEND=hybrid
      - MCP_MEMORY_SQLITE_PATH=/app/data/sqlite_vec.db
      - MCP_MEMORY_BACKUPS_PATH=/app/data/backups
      - MCP_HYBRID_SYNC_OWNER=http
      # Multilingual embeddings; each side embeds independently, so dims needn't match.
      # The Mac instance must use the same local model.
      - MCP_EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - CLOUDFLARE_EMBEDDING_MODEL=@cf/baai/bge-m3
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_D1_DATABASE_ID=${CLOUDFLARE_D1_DATABASE_ID}
      - CLOUDFLARE_VECTORIZE_INDEX=${CLOUDFLARE_VECTORIZE_INDEX:-mcp-memory-index}
      # OAuth for claude.ai (remote connector). X-API-Key keeps working for LibreChat and
      # Claude Code. Approving a login requires typing MCP_MEMORY_API_KEY on /oauth/authorize.
      - MCP_OAUTH_ENABLED=true
      - MCP_OAUTH_STORAGE_BACKEND=sqlite
      - MCP_OAUTH_SQLITE_PATH=/app/data/oauth.db
      - MCP_OAUTH_ISSUER=${MEMORY_PUBLIC_URL:-http://127.0.0.1:2068}
      # Persistent signing keys; without them tokens die on every restart.
      - MCP_OAUTH_PRIVATE_KEY_PATH=/keys/private.pem
      - MCP_OAUTH_PUBLIC_KEY_PATH=/keys/public.pem
      # Per-client login rate limit behind the tunnel (else every request is "cloudflared")
      - MCP_OAUTH_TRUST_PROXY_HEADER=CF-Connecting-IP
    volumes:
      - mcp-memory-data:/app/data
      - mcp-memory-models:/root/.cache
      - ./secrets/mcp-memory-oauth:/keys:ro
    restart: unless-stopped

  # Public HTTPS for claude.ai via Cloudflare Tunnel: outbound-only, no host port.
  # Off until COMPOSE_PROFILES=tunnel is set in .env (with CLOUDFLARE_TUNNEL_TOKEN).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mcp-memory
    restart: unless-stopped

  # Unused (users come from bootstrap-user, config from git), so off by default:
  # start it only with `docker compose --profile admin up -d`. Upstream publishes it
  # on 0.0.0.0, which bypasses UFW; keep it host-local like api if it's ever enabled.
  admin-panel:
    profiles: ["admin"]
    ports: !override
      - "127.0.0.1:${ADMIN_PANEL_PORT:-3000}:3000"

  bootstrap-user:
    image: python:3.12-slim
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
    volumes:
      - ../bin/bootstrap-user.py:/bootstrap.py:ro
    command: ["sh", "-c", "pip install --quiet bcrypt pymongo && python /bootstrap.py"]
    restart: "no"

  syncer:
    image: python:3.12-slim
    depends_on:
      api:
        condition: service_started
      bootstrap-user:
        condition: service_completed_successfully
      mcp-memory:
        condition: service_started
    env_file:
      - .env
    environment:
      - LIBRECHAT_URL=http://api:${PORT}
    volumes:
      - ../agents:/agents:ro
      - ../skills:/skills:ro
      - ../bin/sync.py:/sync.py:ro
    command: ["sh", "-c", "pip install --quiet pyyaml && python /sync.py"]
    restart: "no"

volumes:
  mcp-memory-data:
  mcp-memory-models:
